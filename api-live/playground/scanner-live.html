<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ntentan — Live Medication Scanner</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 1.25rem; }
  h1 { font-size: 1.2rem; }
  .row { display: flex; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 200px; padding: .5rem; font: inherit; }
  button, select { padding: .5rem 1rem; font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #8884; }
  button:disabled { opacity: .5; }
  video { width: 100%; border-radius: 10px; background: #000; }
  #guide { font-size: 1.3rem; font-weight: 600; text-align: center; margin: .75rem 0; min-height: 1.6em; }
  #instr { text-align: center; font-size: 2rem; }
  #match { border: 1px solid #8884; border-radius: 8px; padding: .6rem; font-size: .9rem; display: none; }
  #status { font-size: .8rem; opacity: .7; }
  .ok { color: #38c172; } .warn { color: #e3a008; }
</style>
</head>
<body>
  <h1>Ntentan — Live Scanner <span style="font-size:.7em;opacity:.6">(Gemini Live)</span></h1>
  <div class="row"><input id="server" type="text" value="http://localhost:8080" placeholder="Server URL" /></div>
  <div class="row">
    <input id="uid" type="text" placeholder="User UID (dev: ALLOW_UID_AUTH)" />
    <select id="lang" title="Guidance language">
      <option value="en">English</option>
      <option value="tw">Twi (Akan)</option>
    </select>
    <button id="start">Start scanning</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <video id="video" playsinline muted></video>
  <div id="instr"></div>
  <div id="guide">Point the camera at a medication label.</div>
  <div id="match"></div>
  <div id="status">Idle.</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const ARROWS = {
  move_up: "⬆️", move_down: "⬇️", move_left: "⬅️", move_right: "➡️",
  rotate_left: "↺", rotate_right: "↻", flip: "🔄",
  move_closer: "➕", move_farther: "➖", hold_still: "✋", none: ""
};
const $ = (id) => document.getElementById(id);
let socket = null, stream = null, timer = null;
const video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");

// ── spoken-guidance playback (24 kHz PCM16, same format as /assistant-live) ──
// STREAMING, low-latency, ONE CUE AT A TIME: chunks of a cue are scheduled
// back-to-back on a running clock the instant they arrive (so the voice starts
// almost as soon as the model speaks), but cues never overlap. Turns stream
// sequentially — chunks of cue N, then "speech_end", then chunks of cue N+1 —
// so the first chunk of a new cue cuts off whatever is left of the previous
// one. Freshest-wins: for a live positioning scanner, the newest instruction
// is the one worth hearing, so we interrupt stale guidance rather than queue
// it (which is what caused several prompts to play at once). A tiny gain fade
// on the cut avoids a click.
const OUTPUT_RATE = 24000;
const SCHEDULE_LEAD = 0.08;      // seconds of lead-in before the first chunk
let outCtx = null, masterGain = null, nextTime = 0, liveNodes = new Set(), newCue = true;
function b64decode(b64) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function ensureOut() {
  if (!outCtx) {
    outCtx = new AudioContext({ sampleRate: OUTPUT_RATE });
    masterGain = outCtx.createGain();
    masterGain.connect(outCtx.destination);
  }
  if (outCtx.state === "suspended") outCtx.resume();
  return outCtx;
}
// Drop every scheduled/playing node, fading out first to avoid a click.
function stopLive() {
  if (outCtx && masterGain) {
    const t = outCtx.currentTime;
    try {
      masterGain.gain.cancelScheduledValues(t);
      masterGain.gain.setValueAtTime(masterGain.gain.value, t);
      masterGain.gain.linearRampToValueAtTime(0, t + 0.015);
    } catch {}
  }
  liveNodes.forEach((n) => { try { n.onended = null; n.stop(); } catch {} });
  liveNodes.clear();
  nextTime = 0;
}
function pushChunk(b64) {
  const ctx = ensureOut();
  const bytes = b64decode(b64);
  const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
  const f32 = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 0x8000;

  // First chunk of a new cue → cut off any still-playing previous cue, then
  // restore gain (after the fade) just before the new audio starts.
  if (newCue) {
    stopLive();
    const t = ctx.currentTime;
    masterGain.gain.setValueAtTime(0, t + 0.02);
    masterGain.gain.setValueAtTime(1, t + 0.03);
    newCue = false;
  }

  const buf = ctx.createBuffer(1, f32.length, OUTPUT_RATE);
  buf.copyToChannel(f32, 0);
  const node = ctx.createBufferSource();
  node.buffer = buf; node.connect(masterGain);

  const now = ctx.currentTime;
  if (nextTime < now + SCHEDULE_LEAD) nextTime = now + SCHEDULE_LEAD;
  node.start(nextTime);
  nextTime += buf.duration;

  liveNodes.add(node);
  node.onended = () => liveNodes.delete(node);
}
function endUtterance() {
  // Cue finished arriving; the next chunk begins a fresh cue and will cut off
  // whatever remains of this one if it is still playing.
  newCue = true;
}
function stopPlayback() {
  stopLive();
  newCue = true;
  stopEncoded();
}

// ── Twi guidance playback: one encoded WAV per cue (GhanaNLP TTS) ──
// Same latest-wins, no-interrupt discipline, but each cue is a self-contained
// WAV decoded via decodeAudioData.
let encCtx = null, encCurrent = null, encPending = null, encBusy = false;
function playEncoded(b64) {
  if (encBusy) { encPending = b64; return; }   // keep only the newest
  startEncoded(b64);
}
async function startEncoded(b64) {
  encBusy = true;
  if (!encCtx) encCtx = new AudioContext();
  if (encCtx.state === "suspended") await encCtx.resume();
  let buf;
  try {
    const bytes = b64decode(b64);
    const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    buf = await encCtx.decodeAudioData(ab);
  } catch { encBusy = false; return afterEncoded(); }
  const node = encCtx.createBufferSource();
  node.buffer = buf; node.connect(encCtx.destination);
  encCurrent = node;
  node.start();
  node.onended = () => { encCurrent = null; encBusy = false; afterEncoded(); };
}
function afterEncoded() {
  if (encPending) { const next = encPending; encPending = null; startEncoded(next); }
}
function stopEncoded() {
  try { encCurrent && encCurrent.stop(); } catch {}
  encCurrent = null; encPending = null; encBusy = false;
}

$("start").onclick = async () => {
  const url = $("server").value.trim(), uid = $("uid").value.trim();
  if (!uid) { $("status").textContent = "Enter a user UID first."; return; }

  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  video.srcObject = stream; await video.play();

  const language = $("lang").value;
  socket = io(url + "/scanner-live", { auth: { uid, language }, transports: ["websocket"] });
  socket.on("connect", () => { $("status").textContent = "Connected — streaming frames (" + $("lang").selectedOptions[0].text + ")."; });
  socket.on("response", (json) => render(JSON.parse(json)));
  socket.on("audio", (p) => p?.data && pushChunk(p.data));
  socket.on("speech_end", () => endUtterance());
  socket.on("tts_audio", (p) => p?.data && playEncoded(p.data));
  socket.on("error", (e) => { $("status").textContent = "Error: " + (e?.message || e); });
  socket.on("disconnect", (r) => { $("status").textContent = "Disconnected: " + r; stopPlayback(); });

  // Stream ~1.5 frames/sec; the server throttles to its own tick.
  timer = setInterval(() => {
    if (!socket?.connected || !video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    canvas.toBlob((blob) => blob && blob.arrayBuffer().then((buf) => socket.emit("frame", { buf })), "image/jpeg", 0.8);
  }, 650);

  $("start").disabled = true; $("stop").disabled = false;
};

$("stop").onclick = () => {
  clearInterval(timer);
  stream && stream.getTracks().forEach((t) => t.stop());
  socket && socket.disconnect();
  stopPlayback();
  $("start").disabled = false; $("stop").disabled = true;
  $("status").textContent = "Stopped.";
};

function render(r) {
  if (r.status === "processing") { $("status").textContent = "Processing frame…"; return; }
  $("instr").textContent = ARROWS[r.instruction] || "";
  $("guide").textContent = r.guidance_text || "";
  const m = $("match");
  if (r.status === "success") {
    $("guide").classList.add("ok");
    if (r.prescription_match) {
      const med = r.prescription_match.medication;
      m.style.display = "block";
      m.innerHTML = `✅ <b>${med.name}</b> ${med.strength || ""} — ${med.unitsPerDose} ${med.dosage}` +
        `<br><span style="opacity:.7">distance ${r.prescription_match.distance.toFixed(3)} · ` +
        `${r.prescription_match.withinThreshold ? "confident match" : "below threshold"}</span>`;
    } else {
      m.style.display = "block";
      m.innerHTML = `<span class="warn">Label read, but no matching prescription on file.</span>`;
    }
  } else {
    $("guide").classList.remove("ok");
    m.style.display = "none";
  }
}
</script>
</body>
</html>
